name: Publish release image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Releases are deliberately explicit and can only be made from master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: docker-hub-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      DOCKERHUB_USERNAME: elsdoerfer
      IMAGE_NAME: elsdoerfer/gitolite

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag
        id: release
        run: |
          release_tag="$(./scripts/release-tag.sh)"
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'created=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            printf 'already_released=true\n' >> "$GITHUB_OUTPUT"
            echo "Release $release_tag already exists; leaving its immutable image unchanged."
          else
            printf 'already_released=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Check publishing credential
        if: steps.release.outputs.already_released != 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Set the DOCKERHUB_TOKEN Actions secret before publishing.'
            exit 1
          fi

      - name: Build the release image
        if: steps.release.outputs.already_released != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CREATED_AT: ${{ steps.release.outputs.created }}
        run: |
          docker build --pull --no-cache \
            --label "org.opencontainers.image.created=$CREATED_AT" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --tag docker-gitolite:test \
            .

      - name: Verify Gitolite over SSH
        if: steps.release.outputs.already_released != 'true'
        run: bash test/integration.sh docker-gitolite:test

      - name: Log in to Docker Hub
        if: steps.release.outputs.already_released != 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Publish Docker Hub tags
        if: steps.release.outputs.already_released != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker tag docker-gitolite:test "$IMAGE_NAME:$RELEASE_TAG"
          docker tag docker-gitolite:test "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$RELEASE_TAG"
          docker push "$IMAGE_NAME:latest"

      - name: Create matching Git tag
        if: steps.release.outputs.already_released != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG already points at $tagged_commit."
              exit 1
            fi
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$RELEASE_TAG" "$GITHUB_SHA" --message "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
